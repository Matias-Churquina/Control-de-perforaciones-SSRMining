openapi: 3.0.3
info:
  title: SSRMining Control de Perforaciones API
  version: 1.0.0
  description: API backend desarrollada por Credere.Dev para usuarios, roles, equipos, perforaciones y dashboard operativo SSRMining.
  contact:
    name: Credere.Dev
servers:
  - url: http://localhost:3000/api/v1
tags:
  - name: Auth
  - name: Dashboard
  - name: Roles
  - name: Usuarios
  - name: Equipos
  - name: Perforaciones
paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Iniciar sesion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        "200":
          description: Login exitoso
        "401":
          description: Credenciales invalidas
  /auth/me:
    get:
      tags: [Auth]
      summary: Obtener usuario autenticado desde el token
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Usuario autenticado
        "401":
          description: Token faltante o invalido
  /dashboard/resumen:
    get:
      tags: [Dashboard]
      summary: Obtener KPIs y datasets del dashboard operativo
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: fechaDesde
          schema:
            type: string
            format: date
        - in: query
          name: fechaHasta
          schema:
            type: string
            format: date
        - in: query
          name: estado
          schema:
            $ref: "#/components/schemas/EstadoPerforacion"
        - in: query
          name: idEquipo
          schema:
            type: integer
        - in: query
          name: idUsuarioRegistro
          schema:
            type: integer
        - in: query
          name: fase
          schema:
            type: string
        - in: query
          name: banco
          schema:
            type: integer
      responses:
        "200":
          description: Resumen operativo calculado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardResumenResponse"
        "401":
          description: Token faltante o invalido
        "403":
          description: Rol no autorizado
  /roles:
    get:
      tags: [Roles]
      summary: Listar roles
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Roles registrados
    post:
      tags: [Roles]
      summary: Crear rol
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RolInput"
      responses:
        "201":
          description: Rol creado
  /roles/{idRol}:
    get:
      tags: [Roles]
      summary: Obtener rol por id
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: idRol
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Rol encontrado
    put:
      tags: [Roles]
      summary: Actualizar rol
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: idRol
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RolUpdateInput"
      responses:
        "200":
          description: Rol actualizado
    delete:
      tags: [Roles]
      summary: Desactivar rol
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: idRol
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Rol desactivado
  /usuarios:
    get:
      tags: [Usuarios]
      summary: Listar usuarios
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Usuarios registrados
    post:
      tags: [Usuarios]
      summary: Crear usuario
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsuarioInput"
      responses:
        "201":
          description: Usuario creado
  /usuarios/{idUsuario}:
    get:
      tags: [Usuarios]
      summary: Obtener usuario por id
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: idUsuario
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Usuario encontrado
    put:
      tags: [Usuarios]
      summary: Actualizar usuario
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: idUsuario
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsuarioUpdateInput"
      responses:
        "200":
          description: Usuario actualizado
    delete:
      tags: [Usuarios]
      summary: Desactivar usuario
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: idUsuario
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Usuario desactivado
  /equipos:
    get:
      tags: [Equipos]
      summary: Listar equipos
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Equipos registrados
    post:
      tags: [Equipos]
      summary: Crear equipo
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EquipoInput"
      responses:
        "201":
          description: Equipo creado
  /equipos/{idEquipo}:
    get:
      tags: [Equipos]
      summary: Obtener equipo por id
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: idEquipo
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Equipo encontrado
    put:
      tags: [Equipos]
      summary: Actualizar equipo
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: idEquipo
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EquipoUpdateInput"
      responses:
        "200":
          description: Equipo actualizado
    delete:
      tags: [Equipos]
      summary: Desactivar equipo
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: idEquipo
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Equipo desactivado
  /equipos/{idEquipo}/estado:
    patch:
      tags: [Equipos]
      summary: Cambiar estado de equipo
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: idEquipo
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [estado]
              properties:
                estado:
                  $ref: "#/components/schemas/EstadoEquipo"
      responses:
        "200":
          description: Estado actualizado
  /perforaciones:
    get:
      tags: [Perforaciones]
      summary: Listar perforaciones
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: fechaDesde
          schema:
            type: string
            format: date
        - in: query
          name: fechaHasta
          schema:
            type: string
            format: date
        - in: query
          name: estado
          schema:
            $ref: "#/components/schemas/EstadoPerforacion"
        - in: query
          name: idEquipo
          schema:
            type: integer
        - in: query
          name: idUsuarioRegistro
          schema:
            type: integer
        - in: query
          name: fase
          schema:
            type: string
        - in: query
          name: banco
          schema:
            type: integer
      responses:
        "200":
          description: Perforaciones registradas
    post:
      tags: [Perforaciones]
      summary: Crear perforacion operativa
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PerforacionInput"
      responses:
        "201":
          description: Perforacion creada en estado pendiente
  /perforaciones/{idPerforacion}:
    get:
      tags: [Perforaciones]
      summary: Obtener perforacion por id
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: idPerforacion
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Perforacion encontrada
    put:
      tags: [Perforaciones]
      summary: Actualizar perforacion pendiente
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: idPerforacion
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PerforacionUpdateInput"
      responses:
        "200":
          description: Perforacion actualizada
    delete:
      tags: [Perforaciones]
      summary: Anular perforacion pendiente
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: idPerforacion
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [motivoRechazo]
              properties:
                motivoRechazo:
                  type: string
                  example: Registro anulado por carga incorrecta
      responses:
        "200":
          description: Perforacion anulada
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    DashboardResumenResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/DashboardResumen"
    DashboardResumen:
      type: object
      properties:
        filtros:
          type: object
        kpis:
          type: object
          properties:
            metrosTotales:
              type: number
            pozosCompletados:
              type: integer
            ropPromedio:
              type: number
            adherenciaDiseno:
              type: number
        graficos:
          type: object
          properties:
            metrosPorRoca:
              type: array
              items:
                $ref: "#/components/schemas/SerieValor"
            distribucionTipoPozo:
              type: array
              items:
                $ref: "#/components/schemas/SerieValor"
            metrosPorEquipo:
              type: array
              items:
                $ref: "#/components/schemas/SerieValor"
            metrosPorFase:
              type: array
              items:
                $ref: "#/components/schemas/SerieValor"
            metrosPorBanco:
              type: array
              items:
                $ref: "#/components/schemas/SerieValor"
            rankingOperadores:
              type: array
              items:
                $ref: "#/components/schemas/SerieValor"
            ropPorRoca:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                  ropPromedio:
                    type: number
    SerieValor:
      type: object
      properties:
        name:
          type: string
        value:
          type: number
    EstadoEquipo:
      type: string
      enum: [ACTIVO, INACTIVO, MANTENIMIENTO]
    EstadoPerforacion:
      type: string
      enum: [PENDIENTE, APROBADA, RECHAZADA]
    Rol:
      type: object
      properties:
        idRol:
          type: integer
        nombre:
          type: string
        descripcion:
          type: string
          nullable: true
        activo:
          type: boolean
    RolInput:
      type: object
      required: [nombre]
      properties:
        nombre:
          type: string
          example: OPERADOR
        descripcion:
          type: string
          example: Registra perforaciones operativas
    RolUpdateInput:
      type: object
      properties:
        nombre:
          type: string
        descripcion:
          type: string
        activo:
          type: boolean
    Usuario:
      type: object
      properties:
        idUsuario:
          type: integer
        idRol:
          type: integer
        legajo:
          type: string
        nombre:
          type: string
        apellido:
          type: string
        email:
          type: string
          format: email
        activo:
          type: boolean
    UsuarioInput:
      type: object
      required: [idRol, legajo, nombre, apellido, email, password]
      properties:
        idRol:
          type: integer
          example: 3
        legajo:
          type: string
          example: "1010"
        nombre:
          type: string
          example: Juan
        apellido:
          type: string
          example: Perez
        email:
          type: string
          format: email
          example: juan.perez@ssrmining.local
        password:
          type: string
          example: Usuario12345!
    UsuarioUpdateInput:
      type: object
      properties:
        idRol:
          type: integer
        legajo:
          type: string
        nombre:
          type: string
        apellido:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
        activo:
          type: boolean
    Equipo:
      type: object
      properties:
        idEquipo:
          type: integer
        codigo:
          type: string
        descripcion:
          type: string
        modelo:
          type: string
          nullable: true
        estado:
          $ref: "#/components/schemas/EstadoEquipo"
    EquipoInput:
      type: object
      required: [codigo, descripcion]
      properties:
        codigo:
          type: string
          example: PE 901
        descripcion:
          type: string
          example: Perforadora PE 901
        modelo:
          type: string
          example: Perforadora operativa
        estado:
          $ref: "#/components/schemas/EstadoEquipo"
    EquipoUpdateInput:
      type: object
      properties:
        codigo:
          type: string
        descripcion:
          type: string
        modelo:
          type: string
        estado:
          $ref: "#/components/schemas/EstadoEquipo"
    Perforacion:
      type: object
      properties:
        idPerforacion:
          type: integer
        codigoPerforacion:
          type: string
        fecha:
          type: string
          format: date
        fase:
          type: string
        banco:
          type: integer
        malla:
          type: string
        idPozo:
          type: string
        tipoRoca:
          type: string
        profundidadDiseno:
          type: number
        metrosPerforados:
          type: number
        profundidadReal:
          type: number
        tipoPozo:
          type: string
        estado:
          $ref: "#/components/schemas/EstadoPerforacion"
        calculos:
          type: object
          properties:
            duracionHoras:
              type: number
            rop:
              type: number
            adherencia:
              type: number
    PerforacionInput:
      type: object
      required:
        - fecha
        - fase
        - banco
        - malla
        - idPozo
        - tipoRoca
        - profundidadDiseno
        - metrosPerforados
        - profundidadReal
        - horaInicio
        - horaFin
        - tipoPozo
        - idEquipo
      properties:
        codigoPerforacion:
          type: string
          example: PERF-20260717-PE901-001
        fecha:
          type: string
          format: date
          example: "2026-07-17"
        fase:
          type: string
          example: Fase 7
        banco:
          type: integer
          example: 4110
        malla:
          type: string
          example: "04"
        idPozo:
          type: string
          example: "105"
        tipoRoca:
          type: string
          example: Toba (Blanda)
        profundidadDiseno:
          type: number
          example: 10
        metrosPerforados:
          type: number
          example: 10
        profundidadReal:
          type: number
          example: 10
        horaInicio:
          type: string
          example: "08:00"
        horaFin:
          type: string
          example: "08:20"
        tipoPozo:
          type: string
          example: Produccion
        observaciones:
          type: string
        idEquipo:
          type: integer
          example: 1
    PerforacionUpdateInput:
      type: object
      properties:
        codigoPerforacion:
          type: string
        fecha:
          type: string
          format: date
        fase:
          type: string
        banco:
          type: integer
        malla:
          type: string
        idPozo:
          type: string
        tipoRoca:
          type: string
        profundidadDiseno:
          type: number
        metrosPerforados:
          type: number
        profundidadReal:
          type: number
        horaInicio:
          type: string
        horaFin:
          type: string
        tipoPozo:
          type: string
        observaciones:
          type: string
        idEquipo:
          type: integer
