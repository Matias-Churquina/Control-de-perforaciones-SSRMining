openapi: 3.0.3
info:
  title: SSRMining Control de Perforaciones API
  version: 1.0.0
  description: API backend para usuarios, roles, equipos y registros de perforacion.
servers:
  - url: http://localhost:3000/api/v1
tags:
  - name: Auth
  - name: Roles
  - name: Usuarios
  - name: Equipos
  - name: Perforaciones
paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Iniciar sesion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        "200":
          description: Login exitoso
        "401":
          description: Credenciales invalidas
  /auth/me:
    get:
      tags: [Auth]
      summary: Obtener usuario autenticado desde el token
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Usuario autenticado
        "401":
          description: Token faltante o invalido
  /roles:
    get:
      tags: [Roles]
      summary: Listar roles
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Roles registrados
    post:
      tags: [Roles]
      summary: Crear rol
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Rol creado
  /roles/{idRol}:
    get:
      tags: [Roles]
      summary: Obtener rol por id
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: idRol
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Rol encontrado
    put:
      tags: [Roles]
      summary: Actualizar rol
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: idRol
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Rol actualizado
    delete:
      tags: [Roles]
      summary: Desactivar rol
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: idRol
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Rol desactivado
  /usuarios:
    get:
      tags: [Usuarios]
      summary: Listar usuarios
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Usuarios registrados
    post:
      tags: [Usuarios]
      summary: Crear usuario
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Usuario creado
  /usuarios/{idUsuario}:
    get:
      tags: [Usuarios]
      summary: Obtener usuario por id
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: idUsuario
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Usuario encontrado
    put:
      tags: [Usuarios]
      summary: Actualizar usuario
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: idUsuario
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Usuario actualizado
    delete:
      tags: [Usuarios]
      summary: Desactivar usuario
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: idUsuario
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Usuario desactivado
  /equipos:
    get:
      tags: [Equipos]
      summary: Listar equipos
      responses:
        "501":
          description: Pendiente de implementar
  /perforaciones:
    get:
      tags: [Perforaciones]
      summary: Listar perforaciones
      responses:
        "501":
          description: Pendiente de implementar
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    EstadoEquipo:
      type: string
      enum: [ACTIVO, INACTIVO, MANTENIMIENTO]
    EstadoPerforacion:
      type: string
      enum: [PENDIENTE, APROBADA, RECHAZADA]
    Rol:
      type: object
      properties:
        idRol:
          type: integer
        nombre:
          type: string
        descripcion:
          type: string
          nullable: true
        activo:
          type: boolean
    Usuario:
      type: object
      properties:
        idUsuario:
          type: integer
        idRol:
          type: integer
        legajo:
          type: string
        nombre:
          type: string
        apellido:
          type: string
        email:
          type: string
          format: email
        activo:
          type: boolean
    Equipo:
      type: object
      properties:
        idEquipo:
          type: integer
        codigo:
          type: string
        descripcion:
          type: string
        modelo:
          type: string
          nullable: true
        estado:
          $ref: "#/components/schemas/EstadoEquipo"
    Perforacion:
      type: object
      properties:
        idPerforacion:
          type: integer
        codigoPerforacion:
          type: string
        fecha:
          type: string
          format: date
        fase:
          type: string
        banco:
          type: integer
        malla:
          type: string
        idPozo:
          type: string
        tipoRoca:
          type: string
        profundidadDiseno:
          type: number
        metrosPerforados:
          type: number
        profundidadReal:
          type: number
        tipoPozo:
          type: string
        estado:
          $ref: "#/components/schemas/EstadoPerforacion"
