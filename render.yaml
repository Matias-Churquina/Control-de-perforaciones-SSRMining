services:
  - type: web
    name: ssrmining-api-demo
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build:demo
    startCommand: npm run start:demo
    envVars:
      - key: NODE_ENV
        value: production
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: JWT_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
